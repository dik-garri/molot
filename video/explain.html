<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ролик-пояснение — Вкусите и увидите</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Marck+Script&family=Lora:ital,wght@0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #111; }
  body { display: grid; place-items: center; min-height: 100vh; }
  /* кадр 9:16; при рендере масштаб 2 → 1080×1920 */
  #frame { position: relative; width: 540px; height: 960px; overflow: hidden; background: #F8F2E7; color: #3B2414; font-family: "Golos Text", sans-serif; }
  #paper { position: absolute; inset: 0; }
  #eyebrow { position: absolute; top: 58px; left: 0; right: 0; text-align: center; font: 600 13px/1 "Golos Text"; letter-spacing: .2em; text-transform: uppercase; color: #A26B3B; }
  #card { position: absolute; transform-origin: 0 0; filter: drop-shadow(0 18px 26px rgba(60, 30, 10, .28)); }
  #card svg { display: block; width: 320px; height: 380px; border-radius: 4px; }
  .scene { position: absolute; left: 44px; right: 44px; top: 318px; }
  .label { font: 600 14px/1 "Golos Text"; letter-spacing: .18em; text-transform: uppercase; color: #A26B3B; margin-bottom: 18px; }
  .title { font: italic 600 44px/1.08 Lora; }
  .sub { font: 500 24px/1.4 "Golos Text"; margin-top: 22px; color: #5A361D; }
  .verse { font: italic 400 27px/1.42 Lora; min-height: 7.2em; padding-left: 18px; border-left: 3px solid #D6AE82; }
  .note { font: 500 22px/1.45 "Golos Text"; margin-top: 22px; color: #5A361D; }
  .big { font: italic 600 36px/1.2 Lora; }
  .thanks { font: italic 400 30px/1.35 Lora; }
  .script { font: 400 34px/1 "Marck Script"; color: #A26B3B; }
  .cta { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font: 500 17px/1.5 "Golos Text"; color: #5A361D; }
  .cta b { display: block; font: italic 600 24px/1.3 Lora; color: #3B2414; }
  #stamp { position: absolute; left: 50%; top: 600px; padding: 12px 26px; border: 4px double #A26B3B; border-radius: 10px; color: #A26B3B;
    font: 600 44px/1 Lora; letter-spacing: .12em; opacity: 0; mix-blend-mode: multiply; white-space: nowrap; }
  #title-under { position: absolute; left: 0; right: 0; top: 640px; text-align: center; }
  #fade { position: absolute; inset: 0; background: #F8F2E7; opacity: 0; pointer-events: none; }
  #play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 600 18px "Golos Text"; padding: 16px 26px; border: 0; border-radius: 999px; background: #3B2414; color: #F8F2E7; cursor: pointer; }
  .render #play { display: none; }
</style>
</head>
<body>
<div id="frame">
  <svg id="paper" viewBox="0 0 540 960" preserveAspectRatio="none"><defs>
    <filter id="tex" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="4" seed="4"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .32  0 0 0 0 .2  0 0 0 .5 -.2"/></filter>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset=".6" stop-color="#C9A97F" stop-opacity="0"/><stop offset="1" stop-color="#C9A97F" stop-opacity=".3"/></radialGradient></defs>
    <rect width="540" height="960" filter="url(#tex)"/><rect width="540" height="960" fill="url(#vig)"/></svg>
  <div id="eyebrow"></div>
  <div id="card"></div>
  <div id="title-under"></div>
  <div id="scenes"></div>
  <div id="stamp"></div>
  <div id="fade"></div>
  <button id="play" type="button">▶ Смотреть со звуком</button>
</div>
<script src="../vendor/qrcode.js"></script>
<script src="../js/data.js"></script>
<script src="../js/stickers.js"></script>
<script src="../js/coffee.js"></script>
<script>
  // ?d=1 — какой день; ?render=1 — без кнопки (покадровый рендер); ?t=12 — один кадр
  const Q = new URLSearchParams(location.search), DAY = String(+Q.get("d") || 1).padStart(2, "0");
  if (Q.get("render")) document.body.classList.add("render");
  document.write(`<script src="../js/coffee/d${DAY}.js"><\/script><script src="explain/d${DAY}.js"><\/script>`);
</script>
<script src="audio.js"></script>
<script src="explain.js"></script>
</body>
</html>
