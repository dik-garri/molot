<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Акварель кофе — 24 наклейки</title>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Lora:ital,wght@1,400;1,600&family=Golos+Text:wght@500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #8d8a7a; font: 500 13px "Golos Text", sans-serif; color: #f4efe6; }
  h1 { font-weight: 600; font-size: 18px; margin: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, 320px); gap: 18px; padding: 0 18px 30px; }
  figure { margin: 0; }
  figure svg { display: block; width: 320px; height: 380px; box-shadow: 0 6px 18px rgba(0, 0, 0, .25); }
  figcaption { margin-top: 6px; opacity: .85; }
</style></head><body>
<h1>«Акварель кофе» — 24 наклейки, 80×95 мм</h1>
<div class="grid" id="grid"></div>
<script src="vendor/qrcode.js?v=22"></script><script src="js/data.js?v=22"></script><script src="js/stickers.js?v=22"></script><script src="js/coffee.js?v=22"></script>
<script>
for (let d = 1; d <= 24; d++) document.write(`<script src="js/coffee/d${String(d).padStart(2, "0")}.js?v=${Date.now()}"><\/script>`);
</script>
<script>
// coffee.html — все 24 наклейки выбранного стиля; ?only=1,2,3 — показать только эти дни
const only = (new URLSearchParams(location.search).get("only") || "").split(",").filter(Boolean).map(Number);
const st = STICKER_STYLES.find(s => s.id === "coffee");
document.getElementById("grid").innerHTML = THEMES.filter(t => !only.length || only.includes(t.day))
  .map(t => `<figure>${st.render(t)}<figcaption>${t.day} · ${t.topic}</figcaption></figure>`).join("");
</script>
</body></html>
