<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>День адвента — Вкусите и увидите</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Marck+Script&family=Lora:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css?v=24">
<style>
  body { background: var(--foam); }
  main { max-width: 560px; margin: 0 auto; padding: 22px 20px 40px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .top a { text-decoration: none; }
  .art { width: 150px; margin: 24px 0 0; }
  .art svg { width: 100%; height: auto; display: block; border-radius: 4px; box-shadow: 0 12px 24px -14px rgba(30, 15, 5, .5); }
  .thanks { font: 400 18px var(--body); color: var(--roast-soft); margin: 24px 0 4px; }
  h1 { font-size: clamp(38px, 11vw, 58px); line-height: 1; }
  .verse { margin: 26px 0 0; padding-left: 16px; border-left: 2px solid var(--crema); font: 400 22px/1.4 var(--display); }
  .verse + .verse { margin-top: 18px; }
  .verse cite { display: block; margin-top: 8px; font: 400 13px var(--mono); font-style: normal; color: var(--crema); }
  .pray { margin: 30px 0 32px; padding: 20px 20px 8px; border-radius: 14px; background: var(--bean); }
  .pray b { display: block; font: 500 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--crema); margin-bottom: 10px; }
  .pray ul { margin: 0 0 16px; padding-left: 1.1em; }
  .pray li { margin: 0 0 8px; font-size: 18px; line-height: 1.5; }
  .pray li::marker { color: var(--crema); }
  nav.pn { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; font-size: 15px; }
  nav.pn a { text-decoration: none; color: var(--roast-soft); }
  nav.pn a:hover { color: var(--roast); }
  .note { margin-top: 28px; font-size: 12px; color: var(--roast-soft); }
</style>
</head>
<body>
<main id="day"></main>
<script src="vendor/qrcode.js?v=24"></script><script src="js/data.js?v=24"></script><script src="js/stickers.js?v=24"></script><script src="js/coffee.js?v=24"></script>
<script>for (let d = 1; d <= 24; d++) document.write(`<script src="js/coffee/d${String(d).padStart(2, "0")}.js?v=24"><\/script>`);</script>
<script>
// Страница дня, на которую ведёт QR: места Писания и благодарность пунктами.
(function () {
  // день — из ?d=N (molot/day.html) или из адреса /dd/advent/N (копии N.html на goodnews.kg)
  const fromPath = location.pathname.match(/\/(\d+)(\.html)?$/);
  const d = Math.min(24, Math.max(1, parseInt(new URLSearchParams(location.search).get("d") || (fromPath && fromPath[1]), 10) || 1));
  const href = n => /day\.html$/.test(location.pathname) ? `?d=${n}` : location.protocol === "file:" ? `${n}.html` : `${n}`;
  const t = THEMES[d - 1];
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  document.title = `${d} декабря: ${t.topic} — Вкусите и увидите`;
  const prev = d > 1 ? THEMES[d - 2] : null, next = d < 24 ? THEMES[d] : null;
  document.getElementById("day").innerHTML = `
    <div class="top"><span class="eyebrow">${d} декабря · день ${d} из 24</span><a class="eyebrow" href="./">О календаре</a></div>
    <div class="art">${STICKER_STYLES.find(s => s.id === "coffee").render(t)}</div>
    <div class="thanks">${esc(THANKS)}</div>
    <h1>${esc(t.sticker.join(" "))}</h1>
    ${t.verses.map(v => `<blockquote class="verse">${esc(v.text)}<cite>${esc(v.ref)}</cite></blockquote>`).join("")}
    <div class="pray"><b>Благодарность</b><ul>${t.thanks.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>
    <nav class="pn">${prev ? `<a href="${href(d - 1)}">← ${esc(prev.topic)}</a>` : "<span></span>"}${next ? `<a href="${href(d + 1)}">${esc(next.topic)} →</a>` : "<span>С Рождеством!</span>"}</nav>
    <div class="note">Библия, Синодальный перевод.</div>`;
})();
</script>
</body>
</html>
