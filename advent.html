<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вкусите и увидите — адвент-календарь благодарности</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css?v=24">
<style>
  body { background: var(--foam); }
  main { max-width: 560px; margin: 0 auto; padding: 22px 20px 40px; }
  h1 { font-size: clamp(40px, 12vw, 60px); line-height: 1; margin: 18px 0 12px; }
  .lead { font-size: 18px; line-height: 1.5; color: var(--roast-soft); margin: 0 0 28px; }
  ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li a { display: flex; gap: 14px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--roast); font-size: 17px; }
  li a:hover { color: var(--crema); }
  li span { flex: 0 0 52px; font: 500 13px var(--mono); color: var(--crema); }
  .note { margin-top: 28px; font-size: 12px; color: var(--roast-soft); }
</style>
</head>
<body>
<main>
  <span class="eyebrow">Адвент-календарь · 24 причины благодарить</span>
  <h1>Вкусите и увидите</h1>
  <p class="lead">Каждый день декабря – кофе, место из Писания и одна причина сказать: «Спасибо, Иисус».</p>
  <ol id="days"></ol>
  <div class="note">Библия, Синодальный перевод.</div>
</main>
<script src="js/data.js?v=24"></script>
<script>
// Оглавление для goodnews.kg/dd/advent/: ссылки на страницы дней N (локально — N.html).
const href = n => location.protocol === "file:" ? `${n}.html` : `${n}`;
document.getElementById("days").innerHTML = THEMES.map(t =>
  `<li><a href="${href(t.day)}"><span>${t.day} дек</span>${t.topic.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</a></li>`).join("");
</script>
</body>
</html>
