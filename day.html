<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>День адвента — Вкусите и увидите</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@600;700&family=Unbounded:wght@600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Yeseva+One&family=Kurale&family=Philosopher:ital,wght@0,400;0,700;1,400&family=Marck+Script&family=Lora:ital,wght@1,400;1,600&family=Rubik:wght@600;800;900&family=Press+Start+2P&family=Pacifico&family=Montserrat:wght@700;800&family=Unbounded:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css?v=14">
<style>
  body { background: var(--foam); }
  main { max-width: 560px; margin: 0 auto; padding: 22px 20px 40px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .top a { text-decoration: none; }
  .art { width: 132px; margin: 26px 0 4px; }
  .art svg { width: 100%; height: auto; display: block; border-radius: 4px; box-shadow: 0 12px 24px -14px rgba(30, 15, 5, .5); }
  .thanks { font: 400 19px var(--body); color: var(--roast-soft); margin: 28px 0 4px; }
  h1 { font-size: clamp(42px, 12vw, 64px); line-height: .98; }
  .verse { margin: 28px 0; font: 400 24px/1.35 var(--display); }
  .verse cite { display: block; margin-top: 10px; font: 400 13px var(--mono); font-style: normal; color: var(--crema); }
  .brew { font: 400 12px var(--mono); letter-spacing: .06em; color: var(--roast-soft); text-transform: uppercase; margin-bottom: 10px; }
  .body p { margin: 0 0 12px; font-size: 18px; }
  .today { margin: 26px 0 32px; padding: 18px 18px 16px; border-radius: 12px; background: var(--bean); }
  .today b { display: block; font: 500 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--crema); margin-bottom: 6px; }
  nav.pn { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; font-size: 15px; }
  nav.pn a { text-decoration: none; color: var(--roast-soft); }
  nav.pn a:hover { color: var(--roast); }
  .note { margin-top: 28px; font-size: 12px; color: var(--roast-soft); }
</style>
</head>
<body>
<main id="day"></main>
<script src="vendor/qrcode.js?v=14"></script>
<script src="js/data.js?v=14"></script>
<script src="js/scenes.js?v=14"></script><script src="js/stickers.js?v=14"></script><script src="js/illus.js?v=14"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const d = Math.min(24, Math.max(1, parseInt(q.get("d"), 10) || 1));
  const t = THEMES[d - 1];
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const st = STICKER_STYLES.find(s => s.id === q.get("s")) || STICKER_STYLES[0];
  document.title = `${d} декабря: ${t.topic} — Вкусите и увидите`;
  const prev = d > 1 ? THEMES[d - 2] : null, next = d < 24 ? THEMES[d] : null;
  document.getElementById("day").innerHTML = `
    <div class="top"><span class="eyebrow">${d} декабря · день ${d} из 24</span><a class="eyebrow" href="./">О календаре</a></div>
    ${d <= 5 ? `<div class="art">${st.render(t)}</div>` : ""}
    <div class="thanks">${esc(window.THANKS)}</div>
    <h1>${esc(t.sticker.join(" "))}</h1>
    <blockquote class="verse">${esc(t.verse)}<cite>${esc(t.ref)}</cite></blockquote>
    <div class="brew">Пока вода проходит через фильтр — около трёх минут</div>
    <div class="body">${t.text.map(p => `<p>${esc(p)}</p>`).join("")}</div>
    <div class="today"><b>Сегодня</b>${esc(t.practice)}</div>
    <nav class="pn">${prev ? `<a href="?d=${d - 1}">← ${esc(prev.topic)}</a>` : "<span></span>"}${next ? `<a href="?d=${d + 1}">${esc(next.topic)} →</a>` : "<span>С Рождеством!</span>"}</nav>
    <div class="note">Библия, Синодальный перевод.</div>`;
})();
</script>
</body>
</html>
